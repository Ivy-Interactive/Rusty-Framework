[package]
name = "rusty-ivyml"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Compiles .ivyml declarative markup into Rusty widget trees"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
