<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rusty Widget E2E</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; }
    [data-widget-type="layout"] { display: flex; }
    [data-direction="vertical"] { flex-direction: column; }
    [data-direction="horizontal"] { flex-direction: row; }
    [data-direction="grid"] { display: grid; }
    .widget { margin: 2px 0; }
    button { padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; }
    button[data-variant="primary"] { background: #0066cc; color: white; border-color: #0066cc; }
    button[data-variant="secondary"] { background: #6c757d; color: white; border-color: #6c757d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="text"], input[type="number"], select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; }
    .card-title { font-weight: bold; font-size: 1.1em; }
    .card-subtitle { color: #666; font-size: 0.9em; }
    h1 { font-size: 2em; }
    h2 { font-size: 1.5em; }
    h3 { font-size: 1.17em; }
    code { font-family: monospace; background: #f5f5f5; padding: 2px 4px; border-radius: 2px; }
    label.checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .field-label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 4px; }
    textarea, input[type="date"], input[type="color"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .spacer { flex: 1 1 auto; min-height: 8px; min-width: 8px; }
    .separator[data-orientation="horizontal"] { border-top: 1px solid #e0e0e0; margin: 8px 0; }
    .separator[data-orientation="vertical"] { border-left: 1px solid #e0e0e0; margin: 0 8px; align-self: stretch; }
    .container[data-border="true"] { border: 1px solid #e0e0e0; }
    .container[data-rounded="true"] { border-radius: 8px; }
    .avatar { display: inline-flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 50%; background: #e0e0e0; }
    .avatar[data-size="compact"] { width: 24px; height: 24px; font-size: 0.7em; }
    .avatar[data-size="normal"] { width: 40px; height: 40px; }
    .avatar[data-size="comfortable"] { width: 56px; height: 56px; font-size: 1.2em; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .callout { border-left: 4px solid #0066cc; padding: 12px; background: #f5f8ff; border-radius: 4px; }
    .callout[data-variant="success"] { border-left-color: #28a745; background: #f3fbf5; }
    .callout[data-variant="warning"] { border-left-color: #ffc107; background: #fffbf0; }
    .callout[data-variant="error"] { border-left-color: #dc3545; background: #fdf5f6; }
    .callout-title { font-weight: bold; }
    .skeleton { min-width: 40px; min-height: 12px; background: #eee; border-radius: 4px; }
    .expandable [data-expandable-header] { display: block; width: 100%; text-align: left; }
    .list { display: flex; flex-direction: column; }
    .list-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #f0f0f0; }
    .list-item [data-list-item-subtitle] { color: #666; font-size: 0.9em; }
    .radio-group { display: flex; gap: 8px; }
    [data-widget-type="radio_group"][data-orientation="vertical"] .radio-group { flex-direction: column; }
    .blade-container { display: flex; flex-direction: row; align-items: stretch; gap: 1px; background: #e0e0e0; }
    .blade { display: flex; flex-direction: column; background: white; min-width: 200px; }
    .blade-header { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #e0e0e0; }
    .blade-header [data-blade-title] { font-weight: bold; flex: 1 1 auto; }
    .blade [data-blade-body] { padding: 8px; }
    .breadcrumbs ol { display: flex; align-items: center; gap: 6px; list-style: none; }
    .breadcrumbs [data-breadcrumb-separator] { color: #999; }
    .breadcrumbs button { padding: 2px 4px; border: none; background: none; color: #0066cc; }
    .pagination { display: flex; align-items: center; gap: 4px; }
    .pagination button { padding: 4px 8px; }
    .pagination button[data-active="true"] { background: #0066cc; color: white; border-color: #0066cc; }
    .toolbar { display: flex; align-items: center; gap: 4px; }
    .toolbar button { padding: 4px 8px; }
    .toolbar button[data-checked="true"] { background: #e6f0fb; border-color: #0066cc; }
    .toolbar [role="separator"] { border-left: 1px solid #e0e0e0; align-self: stretch; margin: 0 4px; }
    .toolbar [role="group"] { display: flex; align-items: center; gap: 4px; }
    .stacked-progress-bar { display: flex; overflow: hidden; border-radius: 4px; }
    [data-widget-type="stacked_progress"][data-rounded="true"] .stacked-progress-bar { border-radius: 999px; }
    .stacked-progress-segment { background: #ccc; cursor: default; }
    .stacked-progress-segment[data-selected="true"] { outline: 2px solid #0066cc; }
    .wireframe-callout { border: 2px dashed #999; padding: 12px; border-radius: 4px; }
    .wireframe-callout-title { font-weight: bold; }
    .wireframe-note { border: 1px solid #ddd; background: #fffef0; padding: 12px; border-radius: 4px; }
    .wireframe-note-author { color: #666; font-size: 0.85em; }
  </style>
</head>
<body>
  <div id="app">Connecting...</div>
  <script>
    const app = document.getElementById('app');
    const pageQuery = new URLSearchParams(window.location.search);
    const wsPort = pageQuery.get('port') || window.location.port;
    const wsAppId = pageQuery.get('appId');
    const wsUrl = `ws://${window.location.hostname}:${wsPort}/ws`
      + (wsAppId ? `?appId=${encodeURIComponent(wsAppId)}` : '');

    // Message counters so E2E specs can distinguish a full Refresh from Update patches.
    window.rustyRefreshCount = 0;
    window.rustyUpdateCount = 0;

    let ws;
    function connect() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => { app.textContent = 'Connected, waiting for render...'; };
      ws.onclose = () => { app.textContent = 'Disconnected'; };
      ws.onerror = () => { app.textContent = 'Connection error'; };
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.method === 'refresh') {
          app.innerHTML = '';
          app.appendChild(renderWidget(msg.widgets));
        } else if (msg.method === 'update') {
          // For simplicity, request a full refresh on update patches
          // by re-rendering from the patched tree
          applyPatches(msg.patches);
        }
      };
    }

    function sendEvent(widgetId, eventName, args) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          method: 'event',
          widgetId: widgetId,
          eventName: eventName,
          args: args || {}
        }));
      }
    }

    // `state` must always be present: ClientMessage::Navigate has no serde default,
    // so a message omitting it fails to deserialize and is dropped without a reply.
    window.rustyNavigate = function (appId) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ method: 'navigate', appId: appId, state: null }));
      }
    };

    function renderWidget(node) {
      if (!node || typeof node !== 'object') {
        return document.createTextNode(String(node || ''));
      }

      const type = node.type;
      const el = document.createElement('div');
      el.classList.add('widget');
      el.setAttribute('data-widget-type', type || 'unknown');
      if (node.id) el.setAttribute('data-widget-id', node.id);

      switch (type) {
        case 'button': {
          const btn = document.createElement('button');
          btn.textContent = node.title || '';
          if (node.variant) btn.setAttribute('data-variant', node.variant);
          if (node.disabled) btn.disabled = true;
          if (node.loading) btn.setAttribute('data-loading', 'true');
          if (node.hasOnClick && node.id) {
            btn.addEventListener('click', () => sendEvent(node.id, 'onClick', {}));
          }
          el.appendChild(btn);
          break;
        }
        case 'text_block': {
          const variant = node.variant || 'block';
          let tag = 'span';
          if (variant === 'heading1') tag = 'h1';
          else if (variant === 'heading2') tag = 'h2';
          else if (variant === 'heading3') tag = 'h3';
          else if (variant === 'heading4') tag = 'h4';
          else if (variant === 'paragraph') tag = 'p';
          else if (variant === 'code') tag = 'code';
          else if (variant === 'label') tag = 'span';
          const textEl = document.createElement(tag);
          textEl.textContent = node.content || '';
          if (variant === 'label') textEl.classList.add('field-label');
          el.setAttribute('data-variant', variant);
          el.appendChild(textEl);
          break;
        }
        case 'text_input': {
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          const input = document.createElement('input');
          input.type = 'text';
          input.value = node.value || '';
          input.placeholder = node.placeholder || '';
          if (node.disabled) input.disabled = true;
          if (node.readOnly) input.readOnly = true;
          if (node.hasOnChange && node.id) {
            input.addEventListener('input', (e) => {
              sendEvent(node.id, 'onChange', { value: e.target.value });
            });
          }
          el.appendChild(input);
          break;
        }
        case 'number_input': {
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          const input = document.createElement('input');
          input.type = 'number';
          if (node.value != null) input.value = String(node.value);
          if (node.min != null) input.min = String(node.min);
          if (node.max != null) input.max = String(node.max);
          if (node.step != null) input.step = String(node.step);
          if (node.disabled) input.disabled = true;
          if (node.hasOnChange && node.id) {
            input.addEventListener('input', (e) => {
              sendEvent(node.id, 'onChange', { value: parseFloat(e.target.value) || 0 });
            });
          }
          el.appendChild(input);
          break;
        }
        case 'select': {
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          const select = document.createElement('select');
          if (node.placeholder) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = node.placeholder;
            opt.disabled = true;
            select.appendChild(opt);
          }
          (node.options || []).forEach(o => {
            const opt = document.createElement('option');
            opt.value = o.value;
            opt.textContent = o.label;
            if (o.value === node.value) opt.selected = true;
            select.appendChild(opt);
          });
          if (node.disabled) select.disabled = true;
          if (node.hasOnChange && node.id) {
            select.addEventListener('change', (e) => {
              sendEvent(node.id, 'onChange', { value: e.target.value });
            });
          }
          el.appendChild(select);
          break;
        }
        case 'checkbox': {
          const label = document.createElement('label');
          label.classList.add('checkbox-label');
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = !!node.checked;
          if (node.disabled) input.disabled = true;
          if (node.hasOnChange && node.id) {
            input.addEventListener('change', (e) => {
              sendEvent(node.id, 'onChange', { value: e.target.checked });
            });
          }
          label.appendChild(input);
          if (node.label) {
            const span = document.createElement('span');
            span.textContent = node.label;
            label.appendChild(span);
          }
          el.appendChild(label);
          break;
        }
        case 'layout': {
          el.setAttribute('data-direction', node.direction);
          if (node.gap) el.style.gap = node.gap + 'px';
          if (node.padding) el.style.padding = node.padding + 'px';
          if (node.width) el.style.width = node.width;
          if (node.height) el.style.height = node.height;
          if (node.wrap) {
            el.style.flexWrap = 'wrap';
            el.setAttribute('data-wrap', 'true');
          }
          if (node.direction === 'grid' && node.columns) {
            el.style.gridTemplateColumns = `repeat(${node.columns}, 1fr)`;
          }
          (node.children || []).forEach(child => {
            el.appendChild(renderWidget(child));
          });
          break;
        }
        case 'card': {
          el.classList.add('card');
          if (node.padding) el.style.padding = node.padding + 'px';
          if (node.title) {
            const t = document.createElement('div');
            t.classList.add('card-title');
            t.textContent = node.title;
            el.appendChild(t);
          }
          if (node.subtitle) {
            const s = document.createElement('div');
            s.classList.add('card-subtitle');
            s.textContent = node.subtitle;
            el.appendChild(s);
          }
          (node.children || []).forEach(child => {
            el.appendChild(renderWidget(child));
          });
          if (node.footer) {
            const f = document.createElement('div');
            f.classList.add('card-footer');
            node.footer.forEach(child => f.appendChild(renderWidget(child)));
            el.appendChild(f);
          }
          break;
        }
        case 'data_table': {
          const table = document.createElement('table');
          const visible = (node.columns || []).filter(c => !c.hidden);

          const thead = document.createElement('thead');
          const headRow = document.createElement('tr');
          visible.forEach(c => {
            const th = document.createElement('th');
            th.textContent = c.header || '';
            th.setAttribute('data-column-name', c.name || '');
            th.setAttribute('data-column-type', c.type);
            if (c.sortDirection && c.sortDirection !== 'none') {
              th.setAttribute('data-sort-direction', c.sortDirection);
            }
            headRow.appendChild(th);
          });
          thead.appendChild(headRow);
          table.appendChild(thead);

          const tbody = document.createElement('tbody');
          (node.rows || []).forEach((row, rowIndex) => {
            const tr = document.createElement('tr');
            visible.forEach((c, columnIndex) => {
              const td = document.createElement('td');
              const value = row ? row[c.name] : undefined;
              td.textContent = value == null ? '' : String(value);
              if (node.hasOnCellClick && node.id) {
                td.addEventListener('click', () => {
                  sendEvent(node.id, 'cellclick', {
                    rowIndex,
                    columnIndex,
                    columnName: c.name,
                    cellValue: value == null ? null : value
                  });
                });
              }
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);

          if (node.config) {
            el.setAttribute('data-selection-mode', node.config.selectionMode);
            if (node.config.showSearch) el.setAttribute('data-show-search', 'true');
          }
          el.appendChild(table);
          break;
        }
        case 'form': {
          if (node.disabled) el.setAttribute('data-disabled', 'true');
          (node.children || []).forEach(child => {
            el.appendChild(renderWidget(child));
          });
          const submit = document.createElement('button');
          submit.textContent = node.submitTitle || 'Submit';
          submit.setAttribute('data-form-submit', 'true');
          if (node.disabled) submit.disabled = true;
          if (node.hasOnSubmit && node.id) {
            submit.addEventListener('click', () => sendEvent(node.id, 'submit', {}));
          }
          el.appendChild(submit);
          break;
        }
        case 'field': {
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          if (node.required) el.setAttribute('data-required', 'true');
          if (node.description) {
            const d = document.createElement('div');
            d.setAttribute('data-field-description', 'true');
            d.textContent = node.description;
            el.appendChild(d);
          }
          if (node.child) el.appendChild(renderWidget(node.child));
          if (node.help) {
            const h = document.createElement('div');
            h.setAttribute('data-field-help', 'true');
            h.textContent = node.help;
            el.appendChild(h);
          }
          if (node.invalid) {
            const v = document.createElement('div');
            v.setAttribute('data-field-invalid', 'true');
            v.textContent = node.invalid;
            el.appendChild(v);
          }
          break;
        }
        case 'diff_view': {
          el.setAttribute('data-view-type', node.viewType);
          if (node.language) el.setAttribute('data-language', node.language);
          if (node.oldRevision) el.setAttribute('data-old-revision', node.oldRevision);
          if (node.newRevision) el.setAttribute('data-new-revision', node.newRevision);
          if (node.wordWrap) el.setAttribute('data-word-wrap', 'true');
          if (node.collapsible) el.setAttribute('data-collapsible', 'true');
          if (node.defaultCollapsed) el.setAttribute('data-default-collapsed', 'true');
          const pre = document.createElement('pre');
          pre.textContent = node.diff || '';
          el.appendChild(pre);
          break;
        }
        case 'qr_code': {
          el.setAttribute('data-value', node.value || '');
          el.setAttribute('data-error-correction-level', node.errorCorrectionLevel);
          if (node.pixelSize != null) el.setAttribute('data-pixel-size', String(node.pixelSize));
          break;
        }
        case 'activity_heatmap': {
          el.setAttribute('data-interval', node.interval);
          el.setAttribute('data-day-count', String((node.data || []).length));
          if (node.valueLabel) el.setAttribute('data-value-label', node.valueLabel);
          if (node.startDate) el.setAttribute('data-start-date', node.startDate);
          if (node.endDate) el.setAttribute('data-end-date', node.endDate);
          (node.data || []).forEach(day => {
            const cell = document.createElement('span');
            cell.setAttribute('data-day', day.date || '');
            cell.setAttribute('data-count', String(day.count == null ? 0 : day.count));
            if (day.hour != null) cell.setAttribute('data-hour', String(day.hour));
            if (node.hasOnDayClick && node.id) {
              cell.addEventListener('click', () => sendEvent(node.id, 'dayclick', day));
            }
            el.appendChild(cell);
          });
          break;
        }
        case 'terminal': {
          if (node.cols != null) el.setAttribute('data-cols', String(node.cols));
          if (node.rows != null) el.setAttribute('data-rows', String(node.rows));
          el.setAttribute('data-cursor-style', node.cursorStyle);
          el.setAttribute('data-scrollback', String(node.scrollback == null ? 1000 : node.scrollback));
          if (node.closed) el.setAttribute('data-closed', 'true');
          if (node.loading) el.setAttribute('data-loading', 'true');
          const pre = document.createElement('pre');
          pre.textContent = node.initialContent || '';
          el.appendChild(pre);
          break;
        }
        case 'rich_text_input': {
          if (node.showToolbar) {
            const toolbar = document.createElement('div');
            toolbar.setAttribute('data-toolbar', 'true');
            el.appendChild(toolbar);
          }
          const editor = document.createElement('div');
          editor.setAttribute('data-editor', 'true');
          editor.setAttribute('contenteditable', node.editable && !node.disabled ? 'true' : 'false');
          editor.innerHTML = node.value || '';
          if (node.placeholder) editor.setAttribute('data-placeholder', node.placeholder);
          if (node.hasOnChange && node.id) {
            editor.addEventListener('input', () => {
              sendEvent(node.id, 'change', { value: editor.innerHTML });
            });
          }
          if (node.hasOnFocus && node.id) {
            editor.addEventListener('focus', () => sendEvent(node.id, 'focus', {}));
          }
          if (node.hasOnBlur && node.id) {
            editor.addEventListener('blur', () => sendEvent(node.id, 'blur', {}));
          }
          el.appendChild(editor);
          if (node.invalid) {
            const v = document.createElement('div');
            v.setAttribute('data-invalid', 'true');
            v.textContent = node.invalid;
            el.appendChild(v);
          }
          break;
        }
        case 'badge': {
          const badge = document.createElement('span');
          badge.classList.add('badge');
          badge.textContent = node.label || '';
          if (node.variant) badge.setAttribute('data-variant', node.variant);
          if (node.color) badge.setAttribute('data-color', node.color);
          el.appendChild(badge);
          break;
        }
        case 'progress': {
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          const bar = document.createElement('progress');
          if (node.indeterminate) {
            el.setAttribute('data-indeterminate', 'true');
          } else {
            bar.value = node.value != null ? node.value : 0;
            bar.max = node.max != null ? node.max : 1;
          }
          el.appendChild(bar);
          break;
        }
        case 'table': {
          const table = document.createElement('table');
          if (node.sortBy) {
            el.setAttribute('data-sort-by', node.sortBy);
            el.setAttribute('data-sort-ascending', String(!!node.sortAscending));
          }
          const columns = node.columns || [];
          const thead = document.createElement('thead');
          const headRow = document.createElement('tr');
          columns.forEach(col => {
            const th = document.createElement('th');
            th.textContent = col.label;
            th.setAttribute('data-key', col.key);
            if (col.sortable) th.setAttribute('data-sortable', 'true');
            headRow.appendChild(th);
          });
          thead.appendChild(headRow);
          table.appendChild(thead);
          const tbody = document.createElement('tbody');
          (node.rows || []).forEach(row => {
            const tr = document.createElement('tr');
            columns.forEach(col => {
              const td = document.createElement('td');
              const cell = row[col.key];
              td.textContent = cell != null ? String(cell) : '';
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          el.appendChild(table);
          break;
        }
        case 'dialog': {
          el.setAttribute('data-open', String(!!node.open));
          if (!node.open) el.style.display = 'none';
          const box = document.createElement('div');
          box.classList.add('dialog-box');
          if (node.title) {
            const t = document.createElement('div');
            t.classList.add('dialog-title');
            t.textContent = node.title;
            box.appendChild(t);
          }
          (node.children || []).forEach(child => {
            box.appendChild(renderWidget(child));
          });
          if (node.footer) {
            const f = document.createElement('div');
            f.classList.add('dialog-footer');
            node.footer.forEach(child => f.appendChild(renderWidget(child)));
            box.appendChild(f);
          }
          el.appendChild(box);
          break;
        }
        case 'tooltip': {
          el.setAttribute('title', node.content || '');
          el.setAttribute('data-tooltip', node.content || '');
          if (node.child) el.appendChild(renderWidget(node.child));
          break;
        }
        case 'spacer': {
          el.classList.add('spacer');
          break;
        }
        case 'separator': {
          const orientation = node.orientation;
          el.setAttribute('data-orientation', orientation);
          el.classList.add('separator');
          if (node.text) {
            const t = document.createElement('span');
            t.setAttribute('data-separator-text', 'true');
            t.textContent = node.text;
            el.appendChild(t);
          }
          break;
        }
        case 'container': {
          el.classList.add('container');
          if (node.padding != null) el.style.padding = node.padding + 'px';
          if (node.width) el.style.width = node.width;
          if (node.height) el.style.height = node.height;
          const background = node.background;
          if (background) {
            el.style.background = background;
            el.setAttribute('data-background', background);
          }
          if (node.border) el.setAttribute('data-border', 'true');
          if (node.rounded) el.setAttribute('data-rounded', 'true');
          (node.children || []).forEach(child => {
            el.appendChild(renderWidget(child));
          });
          break;
        }
        case 'icon': {
          el.setAttribute('data-icon-name', node.name || '');
          if (node.size != null) {
            el.setAttribute('data-size', String(node.size));
            el.style.fontSize = node.size + 'px';
          }
          const color = node.color;
          if (color) {
            el.setAttribute('data-color', color);
            el.style.color = color;
          }
          const glyph = document.createElement('span');
          glyph.classList.add('icon-glyph');
          glyph.textContent = node.name || '';
          el.appendChild(glyph);
          break;
        }
        case 'image': {
          const img = document.createElement('img');
          img.src = node.src || '';
          img.alt = node.alt || '';
          if (node.width) img.style.width = node.width;
          if (node.height) img.style.height = node.height;
          el.appendChild(img);
          break;
        }
        case 'avatar': {
          el.classList.add('avatar');
          if (node.size) el.setAttribute('data-size', node.size);
          if (node.image) {
            const img = document.createElement('img');
            img.src = node.image;
            img.alt = node.fallback || '';
            el.appendChild(img);
          } else {
            const initials = document.createElement('span');
            initials.setAttribute('data-fallback', 'true');
            initials.textContent = node.fallback || '';
            el.appendChild(initials);
          }
          break;
        }
        case 'callout': {
          el.classList.add('callout');
          el.setAttribute('data-variant', node.variant);
          if (node.title) {
            const t = document.createElement('div');
            t.classList.add('callout-title');
            t.textContent = node.title;
            el.appendChild(t);
          }
          (node.children || []).forEach(child => {
            el.appendChild(renderWidget(child));
          });
          break;
        }
        case 'skeleton': {
          el.classList.add('skeleton');
          if (node.width) el.style.width = node.width;
          if (node.height) el.style.height = node.height;
          break;
        }
        case 'expandable': {
          el.classList.add('expandable');
          const expanded = !!node.expanded;
          el.setAttribute('data-expanded', expanded ? 'true' : 'false');
          const header = document.createElement('button');
          header.setAttribute('data-expandable-header', 'true');
          header.textContent = node.title || '';
          if (node.hasOnToggle && node.id) {
            header.addEventListener('click', () => {
              sendEvent(node.id, 'toggle', { value: !expanded });
            });
          }
          el.appendChild(header);
          const body = document.createElement('div');
          body.setAttribute('data-expandable-body', 'true');
          if (!expanded) body.style.display = 'none';
          (node.children || []).forEach(child => {
            body.appendChild(renderWidget(child));
          });
          el.appendChild(body);
          break;
        }
        case 'list': {
          el.classList.add('list');
          (node.items || []).forEach(item => {
            el.appendChild(renderWidget(item));
          });
          break;
        }
        case 'list_item': {
          el.classList.add('list-item');
          if (node.icon) {
            const icon = document.createElement('span');
            icon.setAttribute('data-icon-name', node.icon);
            icon.textContent = node.icon;
            el.appendChild(icon);
          }
          const title = document.createElement('span');
          title.setAttribute('data-list-item-title', 'true');
          title.textContent = node.title || '';
          el.appendChild(title);
          if (node.subtitle) {
            const sub = document.createElement('span');
            sub.setAttribute('data-list-item-subtitle', 'true');
            sub.textContent = node.subtitle;
            el.appendChild(sub);
          }
          if (node.hasOnClick && node.id) {
            el.style.cursor = 'pointer';
            el.addEventListener('click', () => sendEvent(node.id, 'click', {}));
          }
          break;
        }
        case 'text_area': {
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          const area = document.createElement('textarea');
          area.value = node.value || '';
          area.placeholder = node.placeholder || '';
          if (node.rows != null) area.rows = node.rows;
          if (node.disabled) area.disabled = true;
          if (node.hasOnChange && node.id) {
            area.addEventListener('input', (e) => {
              sendEvent(node.id, 'change', { value: e.target.value });
            });
          }
          el.appendChild(area);
          break;
        }
        case 'slider': {
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          const input = document.createElement('input');
          input.type = 'range';
          input.min = String(node.min == null ? 0 : node.min);
          input.max = String(node.max == null ? 100 : node.max);
          if (node.step != null) input.step = String(node.step);
          input.value = String(node.value == null ? 0 : node.value);
          if (node.disabled) input.disabled = true;
          if (node.hasOnChange && node.id) {
            input.addEventListener('input', (e) => {
              sendEvent(node.id, 'change', { value: parseFloat(e.target.value) || 0 });
            });
          }
          el.appendChild(input);
          break;
        }
        case 'date_input': {
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          const input = document.createElement('input');
          input.type = 'date';
          if (node.value) input.value = node.value;
          if (node.min) input.min = node.min;
          if (node.max) input.max = node.max;
          if (node.disabled) input.disabled = true;
          if (node.hasOnChange && node.id) {
            input.addEventListener('change', (e) => {
              sendEvent(node.id, 'change', { value: e.target.value });
            });
          }
          el.appendChild(input);
          break;
        }
        case 'color_input': {
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          const input = document.createElement('input');
          input.type = 'color';
          if (node.value) input.value = node.value;
          if (node.disabled) input.disabled = true;
          if (node.hasOnChange && node.id) {
            input.addEventListener('input', (e) => {
              sendEvent(node.id, 'change', { value: e.target.value });
            });
          }
          el.appendChild(input);
          break;
        }
        case 'radio_group': {
          el.setAttribute('data-orientation', node.orientation);
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          const group = document.createElement('div');
          group.classList.add('radio-group');
          // A shared `name` is what makes the buttons mutually exclusive; the
          // widget id is unique per render so it is the natural group key.
          const groupName = node.id || 'radio-group';
          (node.options || []).forEach(o => {
            const label = document.createElement('label');
            label.classList.add('checkbox-label');
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = groupName;
            input.value = o.value;
            if (o.value === node.value) input.checked = true;
            if (node.disabled) input.disabled = true;
            if (node.hasOnChange && node.id) {
              input.addEventListener('change', () => {
                sendEvent(node.id, 'change', { value: o.value });
              });
            }
            label.appendChild(input);
            const span = document.createElement('span');
            span.textContent = o.label;
            label.appendChild(span);
            group.appendChild(label);
          });
          el.appendChild(group);
          break;
        }
        case 'multi_select': {
          if (node.label) {
            const lbl = document.createElement('span');
            lbl.classList.add('field-label');
            lbl.textContent = node.label;
            el.appendChild(lbl);
          }
          const select = document.createElement('select');
          select.multiple = true;
          const values = node.values || [];
          (node.options || []).forEach(o => {
            const opt = document.createElement('option');
            opt.value = o.value;
            opt.textContent = o.label;
            if (values.includes(o.value)) opt.selected = true;
            select.appendChild(opt);
          });
          if (node.disabled) select.disabled = true;
          if (node.hasOnChange && node.id) {
            select.addEventListener('change', (e) => {
              // MultiSelect expects every selection as an array under `value`.
              const selected = Array.from(e.target.selectedOptions).map(o => o.value);
              sendEvent(node.id, 'change', { value: selected });
            });
          }
          el.appendChild(select);
          break;
        }
        case 'blade_container': {
          el.classList.add('blade-container');
          (node.children || []).forEach(child => {
            el.appendChild(renderWidget(child));
          });
          break;
        }
        case 'confetti': {
          el.setAttribute('data-trigger', node.trigger || 'auto');
          (node.children || []).forEach(child => {
            el.appendChild(renderWidget(child));
          });
          break;
        }
        case 'blade': {
          el.classList.add('blade');
          el.setAttribute('data-blade-index', String(node.index == null ? 0 : node.index));
          if (node.width) el.style.width = node.width;
          const header = document.createElement('div');
          header.classList.add('blade-header');
          const heading = document.createElement('span');
          heading.setAttribute('data-blade-title', 'true');
          heading.textContent = node.title || '';
          header.appendChild(heading);
          if (node.hasOnRefresh && node.id) {
            const refresh = document.createElement('button');
            refresh.setAttribute('data-blade-refresh', 'true');
            refresh.textContent = 'Refresh';
            refresh.addEventListener('click', () => sendEvent(node.id, 'refresh', {}));
            header.appendChild(refresh);
          }
          // BladeWidget hides Close on the root blade, so the harness does too.
          if (node.hasOnClose && node.id && node.index > 0) {
            const close = document.createElement('button');
            close.setAttribute('data-blade-close', 'true');
            close.textContent = 'Close';
            close.addEventListener('click', () => sendEvent(node.id, 'close', {}));
            header.appendChild(close);
          }
          el.appendChild(header);
          const body = document.createElement('div');
          body.setAttribute('data-blade-body', 'true');
          (node.children || []).forEach(child => {
            body.appendChild(renderWidget(child));
          });
          el.appendChild(body);
          break;
        }
        case 'breadcrumbs': {
          el.classList.add('breadcrumbs');
          if (node.density) el.setAttribute('data-density', node.density);
          if (node.disabled) el.setAttribute('data-disabled', 'true');
          const list = document.createElement('ol');
          const items = node.items || [];
          const separator = node.separator == null ? '/' : node.separator;
          items.forEach((item, i) => {
            const isLast = i === items.length - 1;
            const crumb = document.createElement('li');
            crumb.setAttribute('data-breadcrumb-label', item.label);
            // The last crumb is the current location and never clickable.
            const clickable = item.hasOnClick && !item.disabled && !node.disabled && !isLast;
            if (clickable && node.hasOnItemClick && node.id) {
              const btn = document.createElement('button');
              btn.textContent = item.label;
              if (item.tooltip) btn.title = item.tooltip;
              btn.addEventListener('click', () => sendEvent(node.id, 'itemclick', { index: i }));
              crumb.appendChild(btn);
            } else {
              const span = document.createElement('span');
              span.textContent = item.label;
              if (item.tooltip) span.title = item.tooltip;
              crumb.appendChild(span);
            }
            list.appendChild(crumb);
            if (!isLast) {
              const sep = document.createElement('li');
              sep.setAttribute('data-breadcrumb-separator', 'true');
              sep.textContent = separator;
              list.appendChild(sep);
            }
          });
          el.appendChild(list);
          break;
        }
        case 'pagination': {
          el.classList.add('pagination');
          if (node.density) el.setAttribute('data-density', node.density);
          const page = node.page == null ? 0 : node.page;
          const numPages = node.numPages == null ? 0 : node.numPages;
          const fire = (target) => {
            if (node.hasOnChange && node.id) sendEvent(node.id, 'change', { value: target });
          };

          const prev = document.createElement('button');
          prev.setAttribute('data-page-prev', 'true');
          prev.textContent = 'Prev';
          prev.disabled = !!node.disabled || !page || page === 1;
          prev.addEventListener('click', () => fire(page - 1));
          el.appendChild(prev);

          for (let p = 1; p <= numPages; p++) {
            const btn = document.createElement('button');
            btn.setAttribute('data-page', String(p));
            if (p === page) btn.setAttribute('data-active', 'true');
            btn.textContent = String(p);
            btn.disabled = !!node.disabled;
            btn.addEventListener('click', () => fire(p));
            el.appendChild(btn);
          }

          const next = document.createElement('button');
          next.setAttribute('data-page-next', 'true');
          next.textContent = 'Next';
          next.disabled = !!node.disabled || !page || page === numPages;
          next.addEventListener('click', () => fire(page + 1));
          el.appendChild(next);
          break;
        }
        case 'toolbar': {
          el.classList.add('toolbar');
          el.setAttribute('role', 'toolbar');
          if (node.density) el.setAttribute('data-density', node.density);
          if (node.disabled) el.setAttribute('data-disabled', 'true');
          const renderItems = (items, parent, inheritedDisabled) => {
            (items || []).forEach(item => {
              if (item.variant === 'Group') {
                const group = document.createElement('div');
                group.setAttribute('role', 'group');
                group.setAttribute('data-toolbar-group', item.label || '');
                renderItems(item.children, group, inheritedDisabled || !!item.disabled);
                parent.appendChild(group);
                return;
              }
              if (item.variant === 'Separator') {
                const sep = document.createElement('div');
                sep.setAttribute('role', 'separator');
                parent.appendChild(sep);
                return;
              }
              const btn = document.createElement('button');
              if (item.tag) btn.setAttribute('data-toolbar-tag', item.tag);
              if (item.checked) btn.setAttribute('data-checked', 'true');
              if (item.icon) btn.setAttribute('data-icon-name', item.icon);
              if (item.tooltip) btn.title = item.tooltip;
              btn.textContent = item.label || item.icon || '';
              btn.disabled = inheritedDisabled || !!item.disabled;
              btn.addEventListener('click', () => {
                // ToolbarWidget ignores an item with no tag.
                if (item.tag && node.hasOnSelect && node.id) {
                  sendEvent(node.id, 'select', { tag: item.tag });
                }
              });
              parent.appendChild(btn);
            });
          };
          renderItems(node.items, el, !!node.disabled);
          break;
        }
        case 'animation': {
          el.setAttribute('data-animation-type', node.animationType || '');
          el.setAttribute('data-easing', node.easing || '');
          el.setAttribute('data-trigger', node.trigger || 'auto');
          el.setAttribute('data-visible', String(!!node.visible));
          if (node.direction) el.setAttribute('data-direction', node.direction);
          (node.children || []).forEach(child => {
            el.appendChild(renderWidget(child));
          });
          break;
        }
        case 'stacked_progress': {
          el.classList.add('stacked-progress');
          el.setAttribute('data-rounded', String(!!node.rounded));
          const bar = document.createElement('div');
          bar.classList.add('stacked-progress-bar');
          bar.style.height = (node.barHeight != null ? node.barHeight : 8) + 'px';
          const segments = node.segments || [];
          segments.forEach((segment, index) => {
            const seg = document.createElement('div');
            seg.classList.add('stacked-progress-segment');
            seg.style.flex = String(segment.value);
            if (segment.color) seg.setAttribute('data-color', segment.color);
            if (segment.label) seg.setAttribute('data-label', segment.label);
            if (index === node.selected) seg.setAttribute('data-selected', 'true');
            if (node.hasOnSelect && node.id) {
              seg.addEventListener('click', () => {
                sendEvent(node.id, 'select', { value: index });
              });
            }
            if (node.showLabels && segment.label) {
              const lbl = document.createElement('span');
              lbl.classList.add('stacked-progress-label');
              lbl.textContent = segment.label;
              seg.appendChild(lbl);
            }
            bar.appendChild(seg);
          });
          el.appendChild(bar);
          break;
        }
        case 'wireframe_callout': {
          el.classList.add('wireframe-callout');
          if (node.color) el.setAttribute('data-color', node.color);
          if (node.title) {
            const t = document.createElement('div');
            t.classList.add('wireframe-callout-title');
            t.textContent = node.title;
            el.appendChild(t);
          }
          const text = document.createElement('div');
          text.classList.add('wireframe-callout-text');
          text.textContent = node.text || '';
          el.appendChild(text);
          (node.children || []).forEach(child => {
            el.appendChild(renderWidget(child));
          });
          break;
        }
        case 'wireframe_note': {
          el.classList.add('wireframe-note');
          if (node.color) el.setAttribute('data-color', node.color);
          const text = document.createElement('div');
          text.classList.add('wireframe-note-text');
          text.textContent = node.text || '';
          el.appendChild(text);
          if (node.author) {
            const author = document.createElement('div');
            author.classList.add('wireframe-note-author');
            author.textContent = node.author;
            el.appendChild(author);
          }
          break;
        }
        default: {
          el.textContent = `[Unknown widget: ${type}]`;
          // Still render children if present
          (node.children || []).forEach(child => {
            el.appendChild(renderWidget(child));
          });
          break;
        }
      }

      return el;
    }

    // Simple patch application: on any update, request full re-render
    // This is sufficient for E2E tests which just need to see updated state
    function applyPatches(patches) {
      // Patches change the JSON tree. For E2E simplicity, we track
      // the current tree and apply patches to it, then re-render.
      // But since we don't store the tree, we'll just wait for the
      // next refresh. The server sends updates as patches but we can
      // simply re-render by storing the last known tree.
    }

    // Enhanced: store last tree and apply patches
    let currentTree = null;
    const originalOnMessage = null;

    // Reconnect state
    let reconnectAttempts = 0;
    const RETRY_DELAYS = [0, 2000, 10000];
    const MAX_RECONNECT_ATTEMPTS = 10;

    function scheduleReconnect() {
      if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
        app.textContent = 'Connection failed after ' + MAX_RECONNECT_ATTEMPTS + ' attempts';
        return;
      }
      const delay = RETRY_DELAYS[Math.min(reconnectAttempts, RETRY_DELAYS.length - 1)];
      reconnectAttempts++;
      app.textContent = 'Disconnected. Reconnecting in ' + delay + 'ms... (attempt ' + reconnectAttempts + ')';
      setTimeout(() => connectEnhanced(), delay);
    }

    // Override to track tree state
    function connectEnhanced() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        reconnectAttempts = 0;
        app.textContent = 'Connected, waiting for render...';
      };
      ws.onclose = () => { scheduleReconnect(); };
      ws.onerror = () => {};
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.method === 'refresh') {
          window.rustyRefreshCount++;
          currentTree = msg.widgets;
          app.innerHTML = '';
          app.appendChild(renderWidget(currentTree));
        } else if (msg.method === 'update') {
          window.rustyUpdateCount++;
          if (currentTree && msg.patches) {
            for (const patch of msg.patches) {
              applyPatch(currentTree, patch);
            }
            app.innerHTML = '';
            app.appendChild(renderWidget(currentTree));
          }
        }
      };
    }

    // Applies one RFC6902-style patch from rusty/src/core/diff.rs, which emits
    // replace, add and remove. An unknown op is surfaced loudly rather than
    // ignored, so a spec fails on the patch instead of on a stale DOM.
    function applyPatch(tree, patch) {
      const parts = patch.path.split('/').filter(Boolean);
      if (parts.length === 0) return;

      // Walk to the parent of the final segment.
      let node = tree;
      for (let i = 0; i < parts.length - 1; i++) {
        const key = parts[i];
        node = Array.isArray(node) ? node[parseInt(key)] : node && node[key];
      }
      if (!node || typeof node !== 'object') return;

      const lastKey = parts[parts.length - 1];
      switch (patch.op) {
        case 'replace':
        case 'add':
          if (Array.isArray(node)) {
            node[parseInt(lastKey)] = patch.value;
          } else {
            node[lastKey] = patch.value;
          }
          break;
        case 'remove':
          if (Array.isArray(node)) {
            node.splice(parseInt(lastKey), 1);
          } else {
            delete node[lastKey];
          }
          break;
        default:
          window.rustyPatchErrors = window.rustyPatchErrors || [];
          window.rustyPatchErrors.push(patch);
          break;
      }
    }

    connectEnhanced();
  </script>
