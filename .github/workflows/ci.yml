name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

  alert-on-red-main:
    needs: build
    if: ${{ failure() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `\`main\` is red at ${sha}.\n\nRun: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-red',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: 'CI is red on main', body, labels: ['ci-red'],
              });
            }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Toolchain lockstep
        run: pnpm run check:toolchain

      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Test
        run: pnpm test
