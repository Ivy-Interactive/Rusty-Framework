name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC - the periodic review, automated
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Pre-commit hook harness
        if: ${{ !cancelled() }}
        run: sh ./scripts/test-precommit-hook.sh

  alert-on-red-main:
    needs: build
    if: ${{ failure() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `\`main\` is red at ${sha}.\n\nRun: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-red',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: 'CI is red on main', body, labels: ['ci-red'],
              });
            }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Toolchain lockstep
        run: pnpm run check:toolchain

      - name: Installed tree matches manifest
        run: pnpm run check:installed

      - name: Lint  # --max-warnings=0 lives in the lint script; vp rejects the flag twice
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

  renovate-liveness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Renovate config must not be decoration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GRACE_DAYS: "14"
        run: |
          set -euo pipefail
          if [ ! -f renovate.json ]; then
            echo "No renovate.json - nothing to prove."
            exit 0
          fi
          artifacts=$(gh api "repos/$REPO/issues?state=all&creator=app%2Frenovate&per_page=1" --jq 'length')
          if [ "$artifacts" -gt 0 ]; then
            echo "Renovate App is live (found bot issue/PR)."
            exit 0
          fi
          added=$(gh api "repos/$REPO/commits?path=renovate.json&per_page=100" \
                    --jq '[.[].commit.committer.date] | last')
          if [ -z "$added" ] || [ "$added" = "null" ]; then
            echo "::warning::Cannot date renovate.json; skipping age check."
            exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$added" +%s) ) / 86400 ))
          echo "renovate.json added $added (${age}d ago); 0 Renovate artifacts."
          if [ "$age" -ge "$GRACE_DAYS" ]; then
            echo "::error::renovate.json has existed for ${age}d and Renovate has never run."
            echo "Install https://github.com/apps/renovate on $REPO, or delete renovate.json."
            echo "Ivy-Web/.github/renovate.json sat inert for ~28 months - do not repeat that."
            exit 1
          fi
          echo "::warning::renovate.json present but Renovate has never run (${age}d of ${GRACE_DAYS}d grace). Install https://github.com/apps/renovate on $REPO, or delete the file."

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build widget harness
        working-directory: .
        run: cargo build --bin widget_harness

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  cargo-majors:
    # Renovate parks cargo majors and omits parked deps from the Dependency Dashboard
    # entirely, so this is the only thing that surfaces them. Report-only by design.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Report cargo major updates
        run: node scripts/check-cargo-majors.mjs
