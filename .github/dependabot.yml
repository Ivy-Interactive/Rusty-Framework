# Dependabot version updates: one grouped pull request per ecosystem a week.
# Security updates are switched on in the repository settings.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/e2e"
      - "/src/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/rusty"
      - "/rusty-desktop"
      - "/rusty-docs"
      - "/rusty-filter"
      - "/rusty-ivyml"
      - "/rusty-macros"
      - "/rusty-server"
      - "/rusty-xaml"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
